<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speso — decidi le cene, la lista si scrive da sola</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#283A2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Speso">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin: senza, la risposta è opaca e il service worker non può metterla
     in cache, quindi offline i caratteri non arriverebbero -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
<style>
:root{
  /* palette Speso */
  --crema:#FAF5EF;      /* sfondo */
  --carta:#FFFFFF;      /* schede */
  --guscio:#F1E9E0;     /* pastiglie e superfici tenui */
  --bosco:#283A2A;      /* verde scuro: marchio, carta di stasera, primario */
  --oliva:#6D7633;      /* verde accento: conferme, avanzamento */
  --terra:#CD591E;      /* terracotta: finito, allarmi */
  --ambra:#E4AC55;      /* ambra: poco, attenzione */
  --pietra:#78705C;     /* grigio caldo: testo secondario. Il branding dà #7A725E,
                           di due punti più chiaro: lì non arrivava a 4.5 di contrasto
                           sulla crema, e qui ci va del testo da leggere davvero. */
  --inchiostro:#22261F; /* testo */
  --linea:#EFE7DD;      /* bordi: una linea, non una gabbia */
  --display:'Sora',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
  --tondo:16px;         /* raggio delle schede */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--crema);color:var(--inchiostro);
  font-family:var(--body);font-size:16px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:focus-visible{outline:2px solid var(--oliva);outline-offset:2px}

/* ---------- intestazione ---------- */
.top{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.marchio{display:flex;align-items:center;gap:10px;min-width:0}
.marchio img{flex:none}
.marchio .logotipo{display:none;height:30px;width:auto}
.top .oggi{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--pietra)}
.top h1{font-family:var(--display);font-weight:600;font-size:25px;line-height:1;margin:3px 0 0;letter-spacing:-.01em}
.reset{font-size:12px;font-weight:500;color:var(--pietra);border:1px solid var(--linea);border-radius:99px;padding:8px 14px;background:var(--carta);white-space:nowrap}

.vista{display:none;padding:0 18px}
.vista.attiva{display:block}

/* ---------- carta di stasera ---------- */
.stasera{
  background:var(--bosco);color:#fff;border-radius:20px;
  padding:20px 20px 18px;margin-top:8px;position:relative;overflow:hidden;
}
.stasera::after{
  content:"";position:absolute;right:-52px;top:-52px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none;
}
.fermata{
  display:inline-flex;align-items:center;gap:7px;font-weight:600;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.15);padding:7px 12px;border-radius:99px;
}
.stasera h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.1;margin:14px 0 6px;position:relative}
.stasera .meta{font-size:12.5px;color:rgba(255,255,255,.72)}
.stasera .ing{font-size:14.5px;color:rgba(255,255,255,.86);margin:12px 0 0;position:relative}
.azioni{display:flex;gap:9px;margin-top:16px;position:relative}
.azioni button{
  flex:1;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;
  padding:12px 8px;font-weight:600;font-size:14px;
}
.azioni button.pieno{background:#fff;color:var(--bosco)}

.avviso{
  background:var(--carta);border:1px solid var(--linea);border-left:4px solid var(--ambra);
  border-radius:14px;padding:14px 16px;margin-top:12px;
}
.avviso.chiaro{border-left-color:var(--oliva)}
.avviso .et{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--pietra);margin-bottom:4px}
.avviso .tx{font-size:14.5px;line-height:1.4}
.titoletto{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--pietra);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;
}

/* ---------- settimana ---------- */
.giorno{
  background:var(--carta);border:1px solid var(--linea);border-radius:14px;
  padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
}
.giorno .gg{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--pietra);width:36px;flex:none}
.giorno.oggi{border-color:var(--bosco);border-width:2px}
.giorno.oggi .gg{color:var(--bosco);font-weight:700}
.giorno .nome{flex:1;font-weight:500;font-size:15px}
.giorno .nome.vuoto{color:var(--pietra);font-weight:400}
.giorno .pin{font-size:16px;flex:none;opacity:.85}
.giorno.fuori{background:transparent;border-style:dashed}
.giorno.fuori .nome{color:var(--pietra);font-style:italic}

/* ---------- liste ---------- */
.sezione{background:var(--carta);border:1px solid var(--linea);border-radius:18px;padding:6px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(40,58,42,.03),0 10px 24px -16px rgba(40,58,42,.16)}
.capo-sezione{display:flex;align-items:center;gap:11px;padding:13px 0 9px}
.capo-sezione h3{flex:1;margin:0}
.capo-sezione .conta{font-size:12.5px;color:var(--pietra)}
.quadretto{width:32px;height:32px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center}
.quadretto .tratto{width:18px;height:18px}
.sezione h3{
  font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 3px;letter-spacing:-.01em;
}
.sezione .sub{font-size:12.5px;color:var(--pietra);margin:0 0 10px}
.riga{
  background:var(--carta);border:1px solid var(--linea);border-radius:14px;
  padding:13px 15px;margin-bottom:7px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
}
.sezione .riga{background:transparent;border:none;border-radius:0;padding:11px 2px;margin-bottom:0;border-bottom:1px solid var(--linea)}
.sezione .riga:last-child{border-bottom:none}
.box{
  width:22px;height:22px;border:2px solid var(--linea);border-radius:99px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
}
.riga.presa .box{background:var(--oliva);border-color:var(--oliva)}
.riga.presa .etichetta{text-decoration:line-through;color:var(--pietra)}
.etichetta{flex:1;font-size:15px;text-align:left}
.tratto{width:22px;height:22px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tratto.grande{width:42px;height:42px;stroke-width:1.3}
.tratto.media{width:28px;height:28px;stroke-width:1.5}
.tratto.enorme{width:58px;height:58px;stroke-width:1.1}
.foto{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.confoto{background:var(--guscio)!important;border-color:var(--linea)!important;overflow:hidden;padding:0}
.tratto.mini{width:15px;height:15px;stroke-width:1.8}
.pastiglia{width:36px;height:36px;flex:none;border-radius:99px;background:var(--guscio);color:var(--pietra);display:flex;align-items:center;justify-content:center}
.pastiglia .tratto{width:19px;height:19px}
.stellina{display:inline-flex;vertical-align:-2px;margin-right:5px}
.icona .tratto{width:19px;height:19px}
.tag .tratto{display:inline-block;vertical-align:-3px}
.spunta-riga{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:0}
.cerchio{width:21px;height:21px;flex:none;border-radius:99px;border:1.8px solid var(--linea);display:flex;align-items:center;justify-content:center;color:#fff;margin-left:auto}
.riga.presa .cerchio{background:var(--oliva);border-color:var(--oliva)}
.riga.presa .cerchio .tratto{width:12px;height:12px;stroke-width:2.6}
.tag{
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;flex:none;
}
.tag.finito{background:#F8E4D8;color:#A8410F}
.tag.poco{background:#FBF0DC;color:#8A6420}
.tag.mano{background:var(--guscio);color:#6B6250}
.elimina{color:var(--pietra);font-size:19px;line-height:1;padding:0 2px;flex:none}

.aggiungi{display:flex;gap:8px;margin:4px 0 10px}
.aggiungi select{flex:1;font-family:var(--body);font-size:15px;padding:13px 15px;border:1px solid var(--linea);border-radius:14px;background:var(--carta);color:var(--inchiostro)}
.aggiungi input{
  flex:1;min-width:0;font-family:var(--body);font-size:15px;padding:13px 15px;
  border:1px solid var(--linea);border-radius:14px;background:var(--carta);color:var(--inchiostro);
}
.aggiungi button{background:var(--bosco);color:#fff;border-radius:14px;padding:0 18px;font-weight:600;flex:none}

.fine-spesa{
  width:100%;background:var(--oliva);color:#fff;border-radius:99px;
  padding:15px;font-weight:600;font-size:15.5px;margin:6px 0 30px;
}
.fine-spesa[disabled]{background:var(--linea);color:var(--pietra)}

/* ---------- dispensa ---------- */
.stati{display:flex;gap:4px;flex:none}
.stati button{
  font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:7px 10px;border-radius:99px;background:var(--guscio);color:var(--pietra);border:1px solid transparent;
}
.stati button.on[data-s="ok"]{background:var(--oliva);color:#fff}
.stati button.on[data-s="poco"]{background:var(--ambra);color:#fff}
.stati button.on[data-s="finito"]{background:var(--terra);color:#fff}
.voce{flex:1;min-width:0}
.voce .n{font-size:15px}
.voce .g{font-size:11.5px;color:var(--pietra);margin-top:2px}
.voce .g.allarme{color:var(--terra);font-weight:700}
.voce .g.attenzione{color:var(--ambra)}

/* ---------- filtri ---------- */
.filtri{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.filtri::-webkit-scrollbar{display:none}
.filtri button{
  font-size:12px;font-weight:500;letter-spacing:.01em;
  padding:8px 13px;border-radius:20px;background:var(--carta);border:1px solid var(--linea);
  color:var(--pietra);white-space:nowrap;flex:none;
}
.filtri button.on{background:var(--bosco);color:#fff;border-color:var(--bosco)}

/* ---------- cene ---------- */
.cena{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:13px 15px;margin-bottom:8px;width:100%;text-align:left;display:flex;gap:13px;align-items:flex-start}
.cena .corpo{flex:1;min-width:0}
.ritratto{
  width:58px;height:58px;flex:none;border-radius:14px;border:1px solid;
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.ritrattone{
  width:100%;height:132px;border-radius:18px;border:1px solid;
  display:flex;align-items:center;justify-content:center;font-size:62px;margin-bottom:14px;
}
.passo{background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:14px 15px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.passo .num{font-size:12.5px;font-weight:600;color:var(--oliva);flex:none;padding-top:2px;width:20px}
.passo.fatto{opacity:.45}
.passo.fatto .tx{text-decoration:line-through}
.passo .tx{flex:1;font-size:15px;line-height:1.45}
.cronometro{
  background:var(--bosco);color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:14px;
}
.cronometro .t{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.cronometro .c{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:7px}
.cronometro .az{display:flex;gap:8px;margin-top:14px}
.cronometro .az button{flex:1;background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:12px;font-weight:600}
.spesaGrande{position:fixed;inset:0;background:var(--crema);z-index:40;overflow-y:auto;padding:18px 18px 100px}
.spesaGrande .capo{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.spesaGrande h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0;letter-spacing:-.01em}
.barra{height:8px;background:var(--linea);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.barra i{display:block;height:100%;background:var(--oliva);transition:width .2s}
.rigona{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:18px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:17px}
.rigona .box{width:27px;height:27px}
.chiudiGrande{position:fixed;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:41;background:var(--bosco);color:#fff;border-radius:99px;padding:16px;font-weight:600;font-size:16px}
.cena .stellina{color:var(--ambra)}
.segni{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.segni:empty{display:none}
.griglia{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.piastrella{
  background:var(--carta);border:1px solid var(--linea);border-radius:16px;
  padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;position:relative;
}
.piastrella .ico{font-size:22px;line-height:1;margin-bottom:2px}
.piastrella .et{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.2}
.piastrella .num{font-size:12px;color:var(--pietra)}
.piastrella.scorc{background:var(--bosco);border-color:var(--bosco);color:#fff}
.piastrella.scorc .num{color:rgba(255,255,255,.65)}
.indietro{font-size:12.5px;font-weight:500;color:var(--pietra);padding:10px 0 4px}
.titolone{font-family:var(--display);font-weight:600;font-size:24px;margin:2px 0 10px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
.titolone span{font-family:var(--body);font-size:13px;color:var(--pietra);font-weight:400}
.cena .intestazione{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cena h4{font-family:var(--display);font-weight:600;font-size:16.5px;margin:0;line-height:1.25;letter-spacing:-.01em}
.cena .durata{font-size:12px;font-weight:500;color:var(--pietra);flex:none;padding-top:3px}
.cena .ing{font-size:13.5px;color:var(--pietra);margin:7px 0 0}
.cena .piede{display:flex;align-items:center;gap:9px;margin-top:12px}
.cena .piede .tag{padding:5px 9px}
.tag.dove{background:var(--guscio);color:#6B6250}
.tag.pronta{background:#E9EEDA;color:#4E5623}
.tag.manca{background:#F2EDE6;color:var(--pietra)}
.icona{
  width:40px;height:40px;border-radius:99px;background:var(--guscio);
  border:1px solid var(--linea);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;
}
.icona.attiva{background:var(--oliva);border-color:var(--oliva);color:#fff}
.metti{margin-left:auto;background:var(--bosco);color:#fff;border-radius:99px;padding:10px 16px;font-weight:600;font-size:13.5px}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--carta);
  border-top:1px solid var(--linea);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:20;
}
nav button{flex:1;padding:11px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--pietra)}
nav button .ico{font-size:19px;line-height:1}
nav button .et{font-size:10.5px;font-weight:500;letter-spacing:.01em}
nav button.on{color:var(--bosco)}
nav button.on .et{font-weight:600}
.pallino{position:absolute;top:8px;margin-left:20px;width:7px;height:7px;border-radius:50%;background:var(--terra)}

/* ---------- foglio scelta ---------- */
.velo{position:fixed;inset:0;background:rgba(27,33,36,.45);z-index:30;display:none}
.velo.aperto{display:block}
.foglio{
  position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;z-index:31;
  background:var(--crema);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;
}
.foglio.aperto{transform:translateY(0)}
.foglio h3{font-family:var(--display);font-weight:600;font-size:21px;margin:2px 0 12px}
.scelta{width:100%;text-align:left;background:var(--carta);border:1px solid var(--linea);border-radius:11px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.scelta .n{flex:1;font-size:15px}
.scelta .d{font-size:12px;font-weight:500;color:var(--pietra);flex:none}
.vuoto-stato{text-align:center;color:var(--pietra);font-size:14.5px;padding:34px 20px;line-height:1.6}
.caricamento{text-align:center;color:var(--pietra);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:40px}

/* ---------- cruscotto ---------- */
.capo-pagina{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:2px 0 18px;flex-wrap:wrap}
.capo-pagina h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0;letter-spacing:-.015em;color:var(--bosco)}
.capo-pagina .periodo{font-size:13.5px;color:var(--pietra);margin-top:3px}
.pillola{display:inline-flex;align-items:center;gap:8px;background:var(--oliva);color:#fff;border-radius:99px;padding:11px 18px;font-weight:600;font-size:14px;white-space:nowrap}
.vedi{font-size:13px;font-weight:600;color:var(--oliva);text-transform:none;letter-spacing:0}
.vedi.tutta{display:block;width:100%;text-align:center;padding:13px 0 4px;border-top:1px solid var(--linea);margin-top:6px}
.cruscotto{display:grid;gap:18px;margin-top:6px}
.pannello{padding:6px 16px 8px}
.capo-pannello{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 0 6px}
.capo-pannello h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.capo-pannello .conta{font-size:12.5px;color:var(--pietra)}
.gruppo{padding:6px 0}
.capo-gruppo{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.capo-gruppo .et{font-size:12.5px;font-weight:600;color:var(--pietra)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.minicarta{background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:7px}
.minicarta .quadro{width:44px;height:44px;border-radius:12px;border:1px solid;display:flex;align-items:center;justify-content:center}
.minicarta .n{font-size:13.5px;font-weight:500;line-height:1.25}
.minicarta .d{font-size:11.5px;color:var(--pietra)}


/* pannelli e liste, misurati sul mockup */
.pannello{padding:20px 22px 16px}
.tit-pannello{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
.capo-pannello{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 0 10px}
.capo-blocco{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 12px}
.capo-blocco h3{font-family:var(--display);font-weight:600;font-size:16.5px;margin:0}
.divisorio{height:1px;background:var(--linea);margin:18px 0 16px}
.gruppo{padding:2px 0 10px;border-top:1px solid var(--linea);margin-top:10px}
.gruppo:first-of-type{border-top:none;margin-top:0}
.capo-gruppo{display:flex;align-items:center;gap:9px;padding:10px 0 6px}
.capo-gruppo .et{font-size:14px;font-weight:600;color:var(--inchiostro)}
.vocespesa{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 0 6px 31px}
.vocespesa .n{flex:1;font-size:13.5px;color:var(--inchiostro)}
.vocespesa .q{font-size:11.5px;color:var(--pietra);white-space:nowrap}
.vocespesa .cerchio{width:16px;height:16px;border-width:1.5px;margin-left:2px}
.vocespesa[aria-pressed=true] .n{text-decoration:line-through;color:var(--pietra)}
.piedecarta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.piedecarta .min{font-size:12px;color:var(--pietra)}
.cuore{color:var(--linea);display:inline-flex}
.cuore.attivo{color:var(--ambra)}


.lato{display:grid;gap:16px}
.lato .stasera{padding:18px 18px 16px;border-radius:18px}
.lato .stasera h2{font-size:21px;margin:11px 0 5px}
.lato .stasera .ing{font-size:13.5px;margin-top:9px}
.lato .stasera .azioni{margin-top:13px}
.lato .stasera .azioni button{padding:10px 8px;font-size:13.5px}
@media(max-width:899px){ .cruscotto .lato{order:-1} .lato .pannello{display:none} }


/* telefono: Preferiti sta solo nel menu laterale, e la cena di stasera resta in cima */
#btnPreferiti{display:none}
@media(min-width:900px){ #btnPreferiti{display:flex} }
@media(max-width:899px){
  #vistaStasera{display:flex;flex-direction:column}
  #vistaStasera .capo-pagina{order:1}
  #vistaStasera .cruscotto{order:2}
  #vistaStasera .settimana{order:3}
}

/* ---------- griglie: su telefono una colonna, poi si aprono ---------- */
.settimana,.schede,.sezioni,.faccende{display:grid;gap:8px}
.avvisi{display:grid;gap:10px;margin-top:12px}
.avvisi .avviso{margin-top:0}
.settimana{margin-bottom:26px}
.giorno .quadro{
  width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--linea);
  background:var(--guscio);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--pietra);
}
.giorno .testo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

/* ---------- schermi larghi: il menù passa di lato ---------- */
@media(min-width:900px){
  body{padding-bottom:0;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
  /* le schede si staccano appena dal fondo, come nel branding */
  .riga,.cena,.giorno,.piastrella,.passo,.rigona,.avviso,.sezione{box-shadow:0 1px 2px rgba(40,58,42,.04),0 8px 20px -12px rgba(40,58,42,.14)}
  .sezione{background:var(--carta);border:1px solid var(--linea);border-radius:18px;padding:18px 18px 12px;margin-bottom:0}
  .sezione .riga{box-shadow:none;border-color:transparent;background:transparent;padding:10px 4px;margin-bottom:0;border-bottom:1px solid var(--linea);border-radius:0}
  .sezione .riga:last-child{border-bottom:none}
  .sezioni{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
  .schede{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-items:start}
  .faccende{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
  .avvisi{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .settimana{grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
  /* i giorni diventano schedine verticali */
  .settimana .giorno{
    flex-direction:column;align-items:stretch;gap:9px;padding:12px;text-align:left;margin-bottom:0;
  }
  .settimana .giorno .quadro{width:100%;height:auto;aspect-ratio:1;border-radius:12px}
  .settimana .giorno .gg{width:auto}
  .settimana .giorno .nome{font-size:13px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .settimana .giorno .pin{position:absolute;top:11px;right:11px}
  .settimana .giorno{position:relative}
  /* due colonne: contenuto a sinistra, lista della spesa a fianco */
  .cruscotto{grid-template-columns:minmax(0,1fr) 340px;align-items:start;gap:20px}
  .lato{position:sticky;top:26px}
  .stasera{max-width:none}
  /* le cene diventano schede verticali con il riquadro sopra */
  .schede .cena{flex-direction:column;gap:10px;padding:12px;align-items:stretch}
  .schede .cena .durata{display:none}
  .schede .cena .segni{display:none}
  .schede .cena .ritratto{width:100%;height:132px;aspect-ratio:auto;border-radius:12px;overflow:hidden}
  .schede .cena .corpo{width:100%}
  nav{
    grid-column:1;grid-row:1;
    position:sticky;top:0;align-self:start;height:100vh;left:auto;right:auto;bottom:auto;
    flex-direction:column;justify-content:flex-start;gap:4px;
    border-top:none;border-right:none;background:transparent;padding:96px 14px 18px;
  }
  nav button{
    flex:none;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:12px 14px;border-radius:12px;width:100%;
  }
  nav button .ico{font-size:17px;width:22px;text-align:center}
  nav button .et{font-size:14.5px;letter-spacing:0;text-transform:none}
  nav button.on{background:var(--guscio)}
  nav{background:transparent}
  nav button:hover:not(.on){background:rgba(0,0,0,.03)}
  .pallino{position:static;margin:0 0 0 auto;width:8px;height:8px}
  .top{
    position:fixed;top:0;left:0;width:252px;padding:20px 20px 0;
    align-items:flex-start;flex-direction:column;gap:14px;z-index:21;
  }
  .top .oggi,.top h1{display:none}
  .marchio .logotipo{display:block}
  .marchio img{height:34px;width:auto}
  .reset{display:none}
  .vista{grid-column:2;grid-row:1;padding:26px 36px 60px;max-width:1320px;width:100%;margin:0 auto}
  .vista.attiva{display:block}
  .griglia{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  /* la carta di stasera non deve diventare un cartellone */
  .stasera{max-width:760px}
  .fine-spesa,.aggiungi{max-width:560px}
  .filtri{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap;overflow:visible}
  .foglio{
    left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);max-height:84vh;
    border-radius:20px;transform:translate(-50%,-46%) scale(.98);opacity:0;
    transition:transform .18s ease,opacity .18s ease;
  }
  .foglio.aperto{transform:translate(-50%,-50%) scale(1);opacity:1}
  .spesaGrande{padding:34px 34px 110px}
  .chiudiGrande{left:auto;right:34px;width:300px}
}
/* Opzioni: in fondo al menù laterale, dove sta nel mockup */
.voceOpzioni{display:none}
@media(min-width:900px){
  .voceOpzioni{display:flex;margin-top:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

   toISOString() userebbe UTC e in Italia sposterebbe indietro di un giorno. */
const isoLocale=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

e01:"Affetta le cipolle sottili e stufale in padella con olio a fuoco basso per 15 minuti finché sono dolci. Sbatti le uova con sale, versa, cuoci 3 minuti per lato.",
e02:"Taglia le patate a fette sottili e falle appassire in padella con olio 12 minuti. Unisci le uova sbattute, cuoci coperto a fuoco basso, gira con un piatto.",
e03:"Rosola le zucchine a rondelle 8 minuti. Sbatti le uova col grana, versa, cuoci 3 minuti per lato.",
e04:"Spadella i peperoni a strisce 12 minuti finché cedono. Aggiungi le uova sbattute e chiudi la frittata girandola una volta.",
e05:"Lessa gli asparagi 5 minuti, taglia a pezzi, salta in padella. Unisci uova e grana, cuoci a fuoco basso.",
e06:"Trifola i funghi a fette con olio 8 minuti finché perdono l'acqua. Aggiungi prezzemolo, poi le uova sbattute.",
e07:"Fai appassire gli spinaci in padella, strizzali. Mescola con uova e ricotta, cuoci in padella a fuoco basso 8 minuti.",
e08:"Mescola la pasta avanzata con uova sbattute e grana. Versa in padella calda unta e schiaccia. Cuoci 5 minuti per lato finché fa la crosta.",
e09:"Sbatti le uova, versa in padella, quando rapprende metti cotto e scamorza su metà e chiudi a libro.",
e10:"Pulisci i carciofi, affettali e cuocili in padella con acqua e olio 15 minuti. Unisci uova e grana.",
e11:"Scalda la passata in padella con aglio e olio 8 minuti. Rompi le uova dentro, copri e cuoci 4 minuti. Pane per pucciare.",
e12:"Fai scoppiare i pomodorini in padella 5 minuti. Versa le uova sbattute e mescola continuamente finché sono cremose.",
e13:"Rosola la salsiccia a pezzi 10 minuti. Rompi le uova nella stessa padella, copri e cuoci 4 minuti.",
e14:"Uova sbattute in padella, quando è quasi rappresa metti cotto e formaggio su metà, piega e servi.",
e15:"Trifola i funghi, tienili da parte. Fai l'omelette, farcisci con funghi e grana, piega.",
e16:"Uova in acqua bollente 9 minuti, patate lesse 20. Taglia tutto, condisci con cipolla cruda, olio, sale.",
e17:"Ungi una pirofila che entri nel cestello, rompi le uova, aggiungi pomodorini e grana. 180 gradi per 8 minuti.",
e18:"Acqua a sfiorare il bollore con un goccio d'aceto, fai un vortice, cala l'uovo, 3 minuti. Servi su pane tostato con pepe.",
e19:"Peperoni a strisce in padella con cipolla 15 minuti. Rompi le uova dentro e cuoci coperto.",
e20:"Porri a rondelle e patate a cubetti in padella 20 minuti. Unisci le uova e completa la frittata.",

f01:"Fette spesse di caciocavallo in padella antiaderente senza grassi, 2 minuti per lato finché fa la crosticina. Servi su pane con origano.",
f02:"Arrostisci i peperoni in padella 15 minuti. Metti sopra le fette di provola e copri finché fila.",
f03:"Patate a spicchi in friggitrice 20 minuti a 200 gradi. Ultimi 5 minuti aggiungi la scamorza a cubetti.",
f04:"Fette di pane con mozzarella in mezzo, passa nella farina, poi nell'uovo sbattuto, friggi in poco olio 2 minuti per lato.",
f05:"Apri la burrata su un piatto, pomodori a spicchi intorno, olio, sale. Focaccia a fianco.",
f06:"Taglia i pomodorini a metà, condisci con olio e sale, adagia sopra la stracciatella.",
f07:"Alterna fette di mozzarella e pomodoro, olio, sale, origano. Riposare 5 minuti prima di mangiare.",
f08:"Ricotta in una ciotola, olio a filo, pepe macinato grosso, sale. Pane a fianco.",
f09:"Nodini spezzati a mano su un letto di rucola, crudo sopra, olio e pepe.",
f10:"Schiaccia il gorgonzola sul pane tostato, noci spezzate sopra, un giro di pepe.",
f11:"Brie intero in pirofila, noci sopra, 15 minuti a 180 gradi finché si scioglie. Pane per raccogliere.",
f12:"Feta a cubetti, pomodori a spicchi, olive, olio e origano. Mescola e lascia insaporire.",
f13:"Affetta capocollo e pecorino, disponi con olive e pane. Niente da cuocere.",
f14:"Spalma la ricotta forte sul pane, pomodoro a fette sopra, olio.",
f15:"Griglia la scamorza a fette in padella. Servi su radicchio condito con aceto.",

c01:"Scalda bene la padella con olio, fettina 90 secondi per lato, sale a fine cottura, succo di limone. Non stracuocere.",
c02:"Passa la fettina nell'uovo sbattuto poi nel pangrattato premendo bene. Padella con olio, 3 minuti per lato.",
c03:"Rosola la fettina 1 minuto per lato, aggiungi passata e origano, cuoci coperto 15 minuti.",
c04:"Salsiccia a pezzi e patate a spicchi nel cestello, 200 gradi per 25 minuti, scuoti a metà.",
c05:"Lessa la cicoria 10 minuti, strizza. Rosola la salsiccia, unisci la cicoria con aglio e peperoncino.",
c06:"Peperoni e cipolla in padella 10 minuti, aggiungi la salsiccia a pezzi, cuoci coperto altri 15.",
c07:"Bombette in padella antiaderente a fuoco medio, 15 minuti girandole spesso finché il formaggio dentro si scioglie.",
c08:"Rosola le braciole in olio, sfuma, copri di passata e cuoci a fuoco bassissimo 40 minuti. Il sugo condisce anche la pasta.",
c09:"Arrotola gli involtini, rosolali, poi passata e cottura lenta 45 minuti coperto.",
c10:"Impasta il macinato con sale e pepe senza lavorarlo troppo, forma il disco, padella rovente 4 minuti per lato.",
c11:"Impasta macinato, uovo, pangrattato, sale. Forma le polpette, rosolale, poi 30 minuti nel sugo. Il giorno dopo sono migliori.",
c12:"Polpette e patate a spicchi in teglia o friggitrice, 200 gradi per 30 minuti.",
c13:"Stendi il macinato impastato, metti al centro le uova sode, arrotola. Forno 180 gradi per 50 minuti.",
c14:"Soffritto di carota sedano cipolla 10 minuti, aggiungi il macinato e rosola, poi passata e 25 minuti di fuoco basso.",
c15:"Petto a fette nel cestello con olio, limone e origano. 190 gradi per 15 minuti, gira a metà.",
c16:"Rosola le cosce, sfuma, aggiungi passata, olive e rosmarino, cuoci coperto 40 minuti.",
c17:"Alette asciugate bene, olio e peperoncino, friggitrice 200 gradi per 22 minuti scuotendo due volte.",
c18:"Pollo a fette sottili, uovo e pangrattato, padella con olio 3 minuti per lato.",
c19:"Pollo a striscioline rosolato 5 minuti, togli. Peperoni e cipolla 12 minuti, rimetti il pollo.",
c20:"Straccetti in padella rovente 3 minuti, spegni, aggiungi rucola, limone e scaglie di grana.",
c21:"Infarina le fettine, rosola nel burro, sfuma col vino bianco e fai addensare 3 minuti.",
c22:"Su ogni fettina una fetta di crudo e una foglia di salvia, ferma con stuzzicadenti. Burro, 3 minuti per lato.",
c23:"Rosola la carne a cubetti su fuoco alto, poi carote e passata, coperto a fuoco basso 60 minuti. Patate negli ultimi 20.",
c24:"Rosola lo spezzatino con cipolla, passata e acqua, 55 minuti. Piselli negli ultimi 15.",
c25:"Costine in teglia con patate e rosmarino, 180 gradi per 55 minuti, ultimi 10 a 210 per la crosta.",
c26:"Agnello a pezzi con patate, rosmarino, olio e vino in teglia. 180 gradi per 65 minuti.",
c27:"Rosola il coniglio, sfuma col vino, aggiungi olive e rosmarino, coperto 50 minuti.",
c28:"Cipolle stufate 15 minuti, alza la fiamma, fegato 3 minuti per lato, sfuma col vino. Sale solo alla fine.",
c29:"Würstel incisi e patate a spicchi in friggitrice, 190 gradi per 18 minuti.",
c30:"Alterna carne, peperoni e cipolla sugli stecchi. Padella rovente, 4 minuti per lato.",

p01:"Aglio a fette in olio freddo con peperoncino, scalda piano senza bruciare. Scola la pasta al dente, salta in padella con un mestolo di acqua di cottura.",
p02:"Passata in padella con olio e aglio 12 minuti. Basilico a fine cottura, grana al piatto.",
p03:"Olio, aglio, peperoncino, poi pelati schiacciati, olive e capperi. 15 minuti di fuoco vivace.",
p04:"Pecorino grattugiato con pepe e acqua di cottura fredda fino a fare la crema. Manteca fuori dal fuoco.",

function cene(){return [...CENE,...(S.mie||[])];}

const ICONA_STOP={caseificio:'caseificio',macellaio:'macellaio',panificio:'panificio',pescheria:'pescheria'};
/* una fermata sconosciuta (per esempio arrivata dalla sincronizzazione) non
   deve stampare "undefined": ripiega su un segnaposto neutro. */
const icoStop=s=>ico(ICONA_STOP[s]||'cene','mini');

const FOTO_CAT=new Set(['pasta','carne','uova','formaggi','pesce','verdure','riso','legumi','patate','fredde','etnico','forno','zuppe']);
/* riquadro di un piatto: la fotografia se c'e', altrimenti l'icona a tratto */
function riquadro(f,cls){
  if(FOTO_CAT.has(f.ic))return '<img class="foto" src="foto/'+f.ic+'.jpg" alt="" decoding="async">';
  return ico(f.ic,cls);
}

/* ---------- stagioni e feste ---------- */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function inStagione(p,mese){
  if(!p||!p.st)return true;
  const [a,b]=p.st;
  return a<=b ? (mese>=a&&mese<=b) : (mese>=a||mese<=b);
}
function diStagione(mese){
  return prodotti().filter(p=>p.st&&inStagione(p,mese));
}
function fuoriStagione(c,mese){
  return c.ing.filter(i=>MAPPA[i]&&MAPPA[i].st&&!inStagione(MAPPA[i],mese));
}
function pasqua(anno){
  const a=anno%19,b=Math.floor(anno/100),c=anno%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const i=(19*a+b-d-g+15)%30,k=Math.floor(c/4),l=c%4;
  const m=(32+2*e+2*k-i-l)%7,n=Math.floor((a+11*i+22*m)/451);
  const mese=Math.floor((i+m-7*n+114)/31),giorno=((i+m-7*n+114)%31)+1;
  return new Date(anno,mese-1,giorno);
}
function feste(anno){
  const p=pasqua(anno);
  const pm=new Date(p);pm.setDate(pm.getDate()+1);
  const iso=isoLocale;
  return [
   {d:anno+'-01-01',n:'Capodanno',s:'Lenticchie e cotechino, oppure quello che ti pare'},
   {d:anno+'-01-06',n:'Epifania',s:'Pranzo lungo, cena leggera'},
   {d:iso(p),n:'Pasqua',s:'Agnello al forno con patate, o benedetto se sei dai tuoi'},
   {d:iso(pm),n:'Pasquetta',s:'Grigliata o teglia fredda da portare fuori'},
   {d:anno+'-04-25',n:'25 aprile',s:'Ponte: controlla se i negozi sono chiusi'},
   {d:anno+'-05-01',n:'Primo maggio',s:'Quasi tutto chiuso, fai scorta il giorno prima'},
   {d:anno+'-05-08',n:'San Nicola',s:'Festa patronale di Bari, città in movimento'},
   {d:anno+'-06-02',n:'Due giugno',s:'Festivo, negozi a orario ridotto'},
   {d:anno+'-08-15',n:'Ferragosto',s:'Tutto chiuso: fai la spesa entro il 13'},
   {d:anno+'-11-01',n:'Ognissanti',s:'Festivo, supermercati a orario ridotto'},
   {d:anno+'-12-06',n:'San Nicola d\'inverno',s:'Festa a Bari'},
   {d:anno+'-12-08',n:'Immacolata',s:'Inizio periodo natalizio'},
   {d:anno+'-12-24',n:'Vigilia di Natale',s:'Cena di magro: pesce fresco, prenotalo prima'},
   {d:anno+'-12-25',n:'Natale',s:'Tutto chiuso, spesa entro il 23'},
   {d:anno+'-12-26',n:'Santo Stefano',s:'Avanzi, e sono i migliori'},
   {d:anno+'-12-31',n:'Cenone',s:'Spesa fatta entro il 30'}
  ];
}
function festaVicina(){
  const oggi=new Date(oggiISO());
  const anno=oggi.getFullYear();
  const tutte=[...feste(anno),...feste(anno+1)];
  for(const f of tutte){
    const g=Math.round((new Date(f.d)-oggi)/86400000);
    if(g>=0&&g<=10)return {...f,g:g};
  }
  return null;
}

let ricercaCene='', ricercaDisp='';

let salvataggio=null;
const MEM={};

const archivio={
  async leggi(k){
    if(typeof window!=='undefined'&&window.storage&&window.storage.get){
      try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){return null;}
    }
    // se l'ultima scrittura è finita in memoria (quota piena, navigazione
    // privata), è quella il dato buono: localStorage sarebbe vecchio.
    if(k in MEM)return MEM[k];
    try{return localStorage.getItem(k);}catch(e){return null;}
  },
  async scrivi(k,v){
    if(typeof window!=='undefined'&&window.storage&&window.storage.set){
      try{await window.storage.set(k,v);return;}catch(e){}
    }
    // se localStorage accetta, la copia in memoria non serve più e va tolta:
    // altrimenti resterebbe lì a coprire il dato buono.
    try{localStorage.setItem(k,v);delete MEM[k];}catch(e){MEM[k]=v;}
  },
  async cancella(k){
    if(typeof window!=='undefined'&&window.storage&&window.storage.delete){
      try{await window.storage.delete(k);}catch(e){}
    }
    delete MEM[k];
    try{localStorage.removeItem(k);}catch(e){}
  }
};

async function carica(){
  const v=await archivio.leggi(CHIAVE);
  if(!v)return;
  try{S={...S,...JSON.parse(v)};}catch(e){/* dato illeggibile: riparto pulito */}
}
function salva(){
  clearTimeout(salvataggio);
  salvataggio=setTimeout(()=>archivio.scrivi(CHIAVE,JSON.stringify(S)),400);
}
/* Il salvataggio è ritardato di 400 ms per non scrivere a ogni tocco.
   Se l'app viene chiusa o mandata in secondo piano prima, quel ritardo
   costerebbe l'ultima modifica: qui lo si forza subito. */
function salvaSubito(){
  if(salvataggio===null)return;
  clearTimeout(salvataggio);salvataggio=null;
  // archivio.scrivi non ha await prima della scrittura: il salvataggio
  // avviene subito, mentre la pagina si sta ancora chiudendo.
  archivio.scrivi(CHIAVE,JSON.stringify(S));
}
window.addEventListener('pagehide',salvaSubito);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')salvaSubito();});

/* Gli ingredienti che ti mancano davvero. Se la cena prevede una fermata,

/* ---------- ordine delle corsie ---------- */
const REPARTI_BASE=['Caseificio','Macellaio','Pescheria','Panificio','Pane','Verdura','Frigo','Surgelati','Dispensa','Etnico','Casa','Igiene','Altro'];
function ordineReparti(){
  const o=(S.ordine&&S.ordine.length)?S.ordine.slice():REPARTI_BASE.slice();
  REPARTI_BASE.forEach(r=>{if(!o.includes(r))o.push(r);});
  return o;
}
function spostaReparto(r,dir){
  const o=ordineReparti();
  const i=o.indexOf(r),j=i+dir;
  if(i<0||j<0||j>=o.length)return;
  [o[i],o[j]]=[o[j],o[i]];
  S.ordine=o;salva();
}

function listaTesto(){
  const voci=vociLista().filter(v=>!S.lista[v.id]);

  let t='Spesa — '+new Date().toLocaleDateString('it-IT')+'\n';
  ordineReparti().forEach(r=>{
    if(!gr[r])return;
    t+='\n'+r.toUpperCase()+'\n'+gr[r].map(n=>'- '+n).join('\n')+'\n';
  });
  return t.trim();
}

/* ---------- sincronizzazione Supabase (facoltativa) ---------- */
async function sincronizza(verso){
  const s=S.sync||{};
  if(!s.url||!s.key)throw new Error('Mancano indirizzo e chiave');
  const base=s.url.replace(/\/+$/,'')+'/rest/v1/cucina_stato';
  const testa={'apikey':s.key,'Authorization':'Bearer '+s.key,'Content-Type':'application/json'};
  if(verso==='su'){
    const corpo=JSON.stringify([{id:'unico',dati:S,aggiornato:new Date().toISOString()}]);
    const r=await fetch(base,{method:'POST',headers:{...testa,'Prefer':'resolution=merge-duplicates'},body:corpo});
    if(!r.ok)throw new Error('Errore '+r.status);
    return 'Caricato';
  }else{
    const r=await fetch(base+'?id=eq.unico&select=dati',{headers:testa});
    if(!r.ok)throw new Error('Errore '+r.status);
    const j=await r.json();
    if(!j.length)throw new Error('Nessun dato salvato online');
    S={...S,...j[0].dati};
    aggiornaMappa();aggiornaCene();salva();
    return 'Scaricato';
  }
}

/* la lista della spesa, raccolta in un pannello a fianco */
function pannelloSpesa(voci){
  const gr={}; voci.forEach(v=>{(gr[v.r]=gr[v.r]||[]).push(v);});
  let h=`<div class="sezione pannello">
    <h3 class="tit-pannello">Lista della spesa</h3>
    <div class="capo-pannello"><span class="conta">${voci.length} ${voci.length===1?'articolo':'articoli'}</span><span class="conta">per corsia</span></div>`;
  if(!voci.length){
    h+=`<div class="vuoto-stato" style="padding:22px 6px">Non manca niente.</div></div>`;return h;
  }
  ordineReparti().forEach(rep=>{
    if(!gr[rep])return;
    const [i,col]=FACCIA_REPARTO[rep]||['lista','#7A725E'];
    h+=`<div class="gruppo">
      <div class="capo-gruppo"><span class="quadretto" style="background:${col}1a;color:${col}">${ico(i)}</span>
        <span class="et">${esc(rep)}</span></div>`;
    gr[rep].forEach(v=>{

function extraLista(){

/* Il campo di ricerca conserva quello che hai scritto (spazi e maiuscole
   compresi): è qui che il testo viene normalizzato per il confronto. */
const cercaNorm=t=>String(t||'').trim().toLowerCase();
/* Quello che hai spuntato, comunque tu sia arrivato a spuntarlo. Il bottone
   "ho comprato" conta questo e agisce esattamente su questo. */
function nelCarrello(){
  return Object.keys(S.lista).filter(id=>MAPPA[id]||S.extra.some(e=>e.id===id));

   settimana, o aggiunto a mano. Non dipende dalla modalità di visualizzazione:
   è questo che conta per il pallino di avviso sulla lista. */
function daComprare(){
  const auto=prodotti().filter(p=>serveComprare(p.id)).map(p=>({
    id:p.id,n:p.n,r:p.r,tag:stato(p.id),auto:true
  }));
  const ing=new Set();
  Object.values(S.settimana).forEach(cid=>{
    const c=CENE_MAP[cid];if(!c)return;
    c.ing.forEach(i=>{
      if(!MAPPA[i]||MAPPA[i].c!=='giorno')return;
      // il fresco si compra il giorno stesso: se l'hai preso oggi, non serve più
      const d=S.dispensa[i];
      if(d&&d.s==='ok'&&d.da===oggiISO())return;
      ing.add(i);
    });
  });
  const daCene=[...ing].filter(i=>!auto.some(a=>a.id===i)).map(i=>({
    id:i,n:MAPPA[i].n,r:MAPPA[i].r,tag:'cena',auto:true
  }));
  return [...auto,...daCene,...extraLista()];
}

    // il fresco della bottega in cui ti fermi lo dai per preso; il resto no
    if(p.c==='giorno'&&bottega&&p.r===bottega)return true;
    return disponibile(i);
  });
}

function applicaFiltro(l,k){
  const mese=new Date().getMonth()+1;
  if(k==='pronte')return l.filter(c=>!c.stop&&fattibile(c));
  if(k==='stagione')return l.filter(c=>fuoriStagione(c,mese).length===0&&c.ing.some(i=>MAPPA[i]&&MAPPA[i].st));

  if(k==='pref')return l.filter(c=>S.pref[c.id]);
  if(k==='ff')return l.filter(c=>c.ff);
  if(k==='casa')return l.filter(c=>!c.stop);
  if(k==='scartati')return cene().filter(c=>S.no[c.id]);
  return l.filter(c=>c.cat===k);

/* ---------- modalità cucina ---------- */
let cronometro=null, restanti=0, passiFatti={};
function fermaCronometro(){
  if(cronometro){clearInterval(cronometro);cronometro=null;}
}
function passi(c){
  const t=PROC[c.id]||c.note||'';
  if(!t)return [];
  const frasi=t.split(/(?<=\.)\s+/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  frasi.forEach(function(fr){
    if(fr.length<=70){out.push(fr);return;}
    const pezzi=fr.split(', ');
    let buf='';
    pezzi.forEach(function(p,i){
      buf=buf?buf+', '+p:p;
      const ultimo=i===pezzi.length-1;
      if(buf.length>=32||ultimo){
        let s=buf.trim();
        s=s.charAt(0).toUpperCase()+s.slice(1);
        if(!/[.!?]$/.test(s))s+='.';
        out.push(s);
        buf='';
      }
    });
  });
  return out;
}
function fmt(s){
  const m=Math.floor(s/60), r=s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function foglioCucina(cid){
  const c=CENE_MAP[cid];if(!c)return;
  fermaCronometro();
  passiFatti={};
  restanti=(c.m||10)*60;
  disegnaCucina(c);
}
function disegnaCucina(c){
  const p=passi(c);
  const f=faccia(c);
  apriFoglio(`
    <div class="ritrattone ${FOTO_CAT.has(f.ic)?'confoto':''}" style="background:${f.col}14;border-color:${f.col}2b;color:${f.col}">${riquadro(f,'enorme')}</div>
    <h3>${esc(c.n)}</h3>
    <div class="cronometro">
      <div class="t" id="oro">${fmt(restanti)}</div>
      <div class="c">${cronometro?'in corso':'tempo indicativo'}</div>
      <div class="az">
        <button id="avvia">${cronometro?'Pausa':'Avvia'}</button>
        <button id="azzeraOro">Azzera</button>
      </div>
    </div>
    ${c.ing.length?'<div class="titoletto"><span>Prepara prima</span></div>'+c.ing.map(i=>MAPPA[i]?'<span class="tag mano" style="margin:0 4px 4px 0;display:inline-block">'+esc(MAPPA[i].n)+'</span>':'').join(''):''}
    <div class="titoletto"><span>${p.length} passaggi</span><span>tocca per spuntare</span></div>
    ${p.map((t,i)=>`<button class="passo ${passiFatti[i]?'fatto':''}" data-passo="${i}" aria-pressed="${!!passiFatti[i]}">
      <span class="num">${i+1}</span><span class="tx">${esc(t)}</span>
    </button>`).join('')}
    <button class="fine-spesa" id="finitoCucina" style="margin-top:14px">Ho finito</button>
  `);
  const tic=()=>{
    if(restanti>0)restanti--;
    const o=document.getElementById('oro');
    if(o)o.textContent=fmt(restanti);
    if(restanti<=0){clearInterval(cronometro);cronometro=null;}
  };
  const g=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  g('avvia',()=>{
    if(cronometro)fermaCronometro();
    else cronometro=setInterval(tic,1000);
    disegnaCucina(c);
  });
  g('azzeraOro',()=>{
    fermaCronometro();
    restanti=(c.m||10)*60;disegnaCucina(c);
  });
  g('finitoCucina',()=>{
    S.storico[c.id]=oggiISO();salva();chiudiFoglio();renderTutto();
  });
  document.querySelectorAll('[data-passo]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.passo;
    if(passiFatti[i])delete passiFatti[i];else passiFatti[i]=true;
    disegnaCucina(c);
  });
}

/* ---------- modalità supermercato ---------- */
function apriSupermercato(){
  if(document.getElementById('spesaGrande'))return;
  const box=document.createElement('div');
  box.className='spesaGrande';box.id='spesaGrande';
  document.body.appendChild(box);
  const chiudi=document.createElement('button');
  chiudi.className='chiudiGrande';chiudi.id='chiudiGrande';chiudi.textContent='Esci dal supermercato';
  document.body.appendChild(chiudi);
  chiudi.onclick=()=>{box.remove();chiudi.remove();renderTutto();};
  disegnaSupermercato();
}
function disegnaSupermercato(){
  const box=document.getElementById('spesaGrande');
  if(!box)return;
  const voci=vociLista();
  const prese=nelCarrello().length;
  const perc=voci.length?Math.round(prese/voci.length*100):0;
  const gr={};voci.forEach(v=>{if(!S.lista[v.id])(gr[v.r]=gr[v.r]||[]).push(v);});
  let h=`<div class="capo"><h2>Al supermercato</h2>
    <span class="tag mano">${prese}/${voci.length}</span></div>
    <div class="barra"><i style="width:${perc}%"></i></div>`;
  const vuoto=Object.keys(gr).length===0;
  if(vuoto){
    h+='<div class="vuoto-stato">Preso tutto.<br>Esci e premi "metti in dispensa".</div>';
  }
  ordineReparti().forEach(r=>{
    if(!gr[r])return;
    h+=`<div class="titoletto"><span>${esc(r)}</span><span>${gr[r].length}</span></div>`;
    gr[r].forEach(v=>{
      h+=`<button class="rigona" data-grande="${esc(v.id)}" aria-pressed="false">
        <span class="etichetta">${esc(v.n)}</span><span class="cerchio" aria-hidden="true"></span>
      </button>`;
    });
  });
  const presi=voci.filter(v=>S.lista[v.id]);
  if(presi.length){
    h+=`<div class="titoletto"><span>Nel carrello</span><span>${presi.length}</span></div>`;
    presi.forEach(v=>{
      h+=`<button class="rigona presa" data-grande="${esc(v.id)}" style="opacity:.55" aria-pressed="true">
        <span class="etichetta" style="text-decoration:line-through">${esc(v.n)}</span>
        <span class="cerchio" style="background:var(--oliva);border-color:var(--oliva)" aria-hidden="true">${ico('pronte')}</span>
      </button>`;
    });
  }
  box.innerHTML=h;
  document.querySelectorAll('[data-grande]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.grande;
    if(S.lista[id])delete S.lista[id];else S.lista[id]=true;
    salva();disegnaSupermercato();
  });
}

function foglioScelta(g){
  const l=cene().filter(c=>!S.no[c.id]).sort((a,b)=>

    ${l.map(c=>`<button class="scelta" data-assegna="${esc(g)}|${esc(c.id)}">
      <span class="n">${esc(c.n)}</span>
      <span class="d">${c.stop?icoStop(c.stop)+' ':''}${fattibile(c)?'✓ ':''}${esc(c.m)}′</span>

       '</div>';
  });
  return s;

function renderTutto(){
  renderStasera();renderLista();renderDispensa();renderCene();renderCasa();
  const scad=faccende().filter(x=>{const s=statoFaccenda(x);return s.g!==null&&s.g>x.g;}).length;
  const pc=document.getElementById('pallinoCasa');if(pc)pc.hidden=scad===0;
  const n=daComprare().filter(v=>!S.lista[v.id]).length;
  document.getElementById('pallinoLista').hidden=n===0;

function aggancia(){
  document.querySelectorAll('[data-gg]').forEach(b=>b.onclick=()=>foglioScelta(b.dataset.gg));
  document.querySelectorAll('[data-az="scegli"]').forEach(b=>b.onclick=()=>foglioScelta(chiaveOggi()));
  document.querySelectorAll('[data-az="sorprendi"]').forEach(b=>b.onclick=()=>{
    const g=chiaveOggi();
    let pool=cene().filter(c=>!c.stop&&!S.no[c.id]&&fattibile(c)&&c.id!==S.settimana[g]);
    if(!pool.length)pool=cene().filter(c=>!c.stop&&!S.no[c.id]&&c.id!==S.settimana[g]);
    if(!pool.length)pool=cene().filter(c=>!S.no[c.id]&&c.id!==S.settimana[g]);
    if(!pool.length)pool=cene();
    if(!pool.length)return;   // hai svuotato il ricettario: non c'è niente da estrarre
    S.settimana[g]=pool[Math.floor(Math.random()*pool.length)].id;salva();renderTutto();
  });
  document.querySelectorAll('[data-assegna]').forEach(b=>b.onclick=()=>{
    const [g,cid]=b.dataset.assegna.split('|');
    // se cambi idea sulla cena di stasera, quella di prima non deve restare
    // segnata come mangiata oggi
    const prima=S.settimana[g];
    if(prima&&g===chiaveOggi()&&S.storico[prima]===oggiISO())delete S.storico[prima];
    if(cid){S.settimana[g]=cid;if(g===chiaveOggi())S.storico[cid]=oggiISO();}
    else delete S.settimana[g];
    salva();chiudiFoglio();renderTutto();
  });
  document.querySelectorAll('[data-apri]').forEach(b=>b.onclick=()=>foglioPiatto(b.dataset.apri));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{catAperta=b.dataset.cat;renderCene();window.scrollTo(0,0);});
  const tor=document.getElementById('torna');
  if(tor)tor.onclick=()=>{catAperta=null;renderCene();window.scrollTo(0,0);};
  const pul=document.getElementById('pulisci');
  if(pul)pul.onclick=()=>{ricercaCene='';renderCene();};
  document.querySelectorAll('[data-metti]').forEach(b=>b.onclick=()=>foglioGiorno(b.dataset.metti));
  document.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pref;
    if(S.pref[id])delete S.pref[id];else S.pref[id]=true;
    salva();renderCene();if(document.getElementById('velo').classList.contains('aperto'))foglioPiatto(id);
  });
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.no;
    if(S.no[id])delete S.no[id];else{S.no[id]=true;delete S.pref[id];}
    salva();chiudiFoglio();renderCene();
  });
  document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const c=CENE_MAP[b.dataset.ing];if(!c)return;
    // stessi ingredienti che il bottone ha contato: se ti fermi in bottega,
    // il fresco lo prendi lì e non va segnato come finito in dispensa.
    mancanti(c).forEach(i=>{
      const vecchio=S.dispensa[i];
      S.dispensa[i]={s:'finito'};
      if(vecchio&&vecchio.da)S.dispensa[i].da=vecchio.da;
    });
    salva();renderTutto();
    b.textContent='✓';
  });
  const cerca=document.getElementById('cercaCene');
  if(cerca)cerca.oninput=()=>{
    ricercaCene=cerca.value;
    renderCene();
    const n=document.getElementById('cercaCene');
    if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
  };
  const cercaD=document.getElementById('cercaDisp');
  if(cercaD)cercaD.oninput=()=>{
    ricercaDisp=cercaD.value;
    renderDispensa();
    const n=document.getElementById('cercaDisp');
    if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
  };
  const g=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  g('btnSuper',apriSupermercato);
  document.querySelectorAll('.vai-super').forEach(b=>b.onclick=apriSupermercato);
  g('btnSuperLista',apriSupermercato);
  document.querySelectorAll('[data-vai]').forEach(b=>b.onclick=()=>{
    const v=document.querySelector('nav button[data-v="'+b.dataset.vai+'"]');
    if(v)v.click();
  });
  document.querySelectorAll('[data-cucina]').forEach(b=>b.onclick=()=>foglioCucina(b.dataset.cucina));
  document.querySelectorAll('[data-fatta]').forEach(b=>b.onclick=()=>{
    S.faccende[b.dataset.fatta]=oggiISO();salva();renderTutto();
  });
  document.querySelectorAll('[data-toglifac]').forEach(b=>b.onclick=()=>{
    S.mieFaccende=S.mieFaccende.filter(x=>x.id!==b.dataset.toglifac);salva();renderTutto();
  });
  g('addFacc',()=>{
    const n=document.getElementById('nuovaFacc').value.trim();
    if(!n)return;
    const gg=parseInt(document.getElementById('nuovaFaccG').value,10)||7;
    S.mieFaccende.push({id:'f'+Date.now(),n:n,g:gg,i:'casa',mia:true});
    salva();renderTutto();
  });
  g('apriCorsie',foglioCorsie);
  g('apriStat',foglioStatistiche);
  g('apriSync',foglioSync);
  g('apriReset',azzera);
  g('salvaSync',()=>{
    S.sync={url:document.getElementById('sUrl').value.trim(),key:document.getElementById('sKey').value.trim()};
    salva();
    document.getElementById('esitoSync').textContent='Credenziali salvate.';
  });
  g('pushSync',async()=>{
    const e=document.getElementById('esitoSync');e.textContent='Carico…';
    try{e.textContent=await sincronizza('su');}catch(err){e.textContent='Non riuscito: '+err.message;}
  });
  g('pullSync',async()=>{
    const e=document.getElementById('esitoSync');e.textContent='Scarico…';
    try{e.textContent=await sincronizza('giu');renderTutto();}catch(err){e.textContent='Non riuscito: '+err.message;}
  });
  const mia=document.getElementById('btnMiaRicetta');
  if(mia)mia.onclick=foglioMiaRicetta;
  const mioP=document.getElementById('btnMioProdotto');
  if(mioP)mioP.onclick=foglioMioProdotto;
  const salvaR=document.getElementById('salvaRicetta');
  if(salvaR)salvaR.onclick=()=>{
    const n=document.getElementById('rNome').value.trim();
    if(!n)return;
    const m=parseInt(document.getElementById('rMin').value,10)||10;
    const cat=document.getElementById('rCat').value;
    const note=document.getElementById('rNote').value.trim();
    S.mie.push({id:'mia'+Date.now(),n:n,m:m,cat:cat,mia:true,note:note,ing:[]});
    aggiornaCene();salva();chiudiFoglio();renderTutto();
  };
  const salvaP=document.getElementById('salvaProdotto');
  if(salvaP)salvaP.onclick=()=>{
    const n=document.getElementById('pNome').value.trim();
    if(!n)return;
    const r=document.getElementById('pRep').value;
    const c=document.getElementById('pCat').value;
    S.mieiProd.push({id:'mio'+Date.now(),n:n,r:r,c:c,d:0,mio:true});
    aggiornaMappa();salva();chiudiFoglio();renderTutto();
  };
  document.querySelectorAll('[data-spunta]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.spunta;
    if(S.lista[id])delete S.lista[id];else S.lista[id]=true;
    salva();renderTutto();
  });
  document.querySelectorAll('[data-rimuovi]').forEach(b=>b.onclick=()=>{
    S.extra=S.extra.filter(e=>e.id!==b.dataset.rimuovi);
    delete S.lista[b.dataset.rimuovi];salva();renderTutto();
  });
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.st,s=b.dataset.s;
    const vecchio=S.dispensa[id]||null;
    if(vecchio&&vecchio.s===s){delete S.dispensa[id];}
    else{
      S.dispensa[id]={s:s};
      // la data d'ingresso vale finché è lo stesso pezzo in casa: "c'è" e "poco"
      // sono lo stesso pezzo, ma dopo "finito" quello che segni è roba nuova.
      const stessoPezzo=vecchio&&(vecchio.s==='ok'||vecchio.s==='poco')&&(s==='ok'||s==='poco');
      if(stessoPezzo&&vecchio.da)S.dispensa[id].da=vecchio.da;
      if(s==='ok'&&!S.dispensa[id].da)S.dispensa[id].da=oggiISO();
      if(s==='ok')delete S.lista[id];
    }
    salva();renderTutto();
  });
  document.querySelectorAll('[data-ml]').forEach(b=>b.onclick=()=>{
    S.modoLista=b.dataset.ml;salva();renderTutto();
  });
  document.querySelectorAll('[data-butta]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.butta;
    S.buttati[id]=(S.buttati[id]||0)+1;
    S.dispensa[id]={s:'finito'};
    salva();renderTutto();
  });
  const cop=document.getElementById('btnCopia');
  if(cop)cop.onclick=async()=>{
    const r=await copiaLista();
    if(r===true){cop.textContent='Copiata ✓';setTimeout(()=>renderLista(),1400);}
    else apriFoglio('<h3>La tua lista</h3><div class="avviso"><div class="tx" style="white-space:pre-wrap;font-family:var(--mono);font-size:12px">'+esc(r)+'</div></div>');
  };
  document.querySelectorAll('[data-avanzo]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.avanzo;
    // un avanzo scaduto conta come assente: il primo tocco lo rimette a oggi
    if(avanzoFresco(id))delete S.avanzi[id];else S.avanzi[id]=oggiISO();
    salva();renderTutto();
    if(document.getElementById('velo').classList.contains('aperto'))foglioPiatto(id);
  });
  document.querySelectorAll('[data-sposta]').forEach(b=>b.onclick=()=>{
    const [r,d]=b.dataset.sposta.split('|');
    spostaReparto(r,parseInt(d,10));
    foglioCorsie();renderLista();
  });
  document.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{filtroDisp=b.dataset.fd;renderDispensa();});
  const inp=document.getElementById('inputExtra'),btn=document.getElementById('btnExtra');
  if(btn){
    const add=()=>{
      const v=inp.value.trim();if(!v)return;
      S.extra.push({id:'x'+Date.now(),n:v});inp.value='';salva();renderTutto();
      setTimeout(()=>{const i=document.getElementById('inputExtra');if(i)i.focus();},30);
    };
    btn.onclick=add;
    inp.onkeydown=e=>{if(e.key==='Enter')add();};
  }
  const fine=document.getElementById('btnFineSpesa');
  if(fine)fine.onclick=()=>{
    nelCarrello().forEach(id=>{
      if(MAPPA[id]){S.dispensa[id]={s:'ok',da:oggiISO()};S.conta[id]=(S.conta[id]||0)+1;}
      else S.extra=S.extra.filter(e=>e.id!==id);
    });
    S.lista={};salva();renderTutto();
  };
}
document.getElementById('velo').onclick=chiudiFoglio;
document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>{
  vista=b.dataset.v;
  document.querySelectorAll('nav button[data-v]').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.vista').forEach(v=>v.classList.remove('attiva'));
  document.getElementById('vista'+vista.charAt(0).toUpperCase()+vista.slice(1)).classList.add('attiva');
  const t={stasera:'Stasera',lista:'La lista',dispensa:'La dispensa',cene:'Le cene',casa:'Casa'};
  document.getElementById('titolo').textContent=t[vista];
  window.scrollTo(0,0);
});
function foglioCorsie(){
  const o=ordineReparti();
  apriFoglio(`<h3>Ordine delle corsie</h3>
    <p class="sub" style="margin:-6px 0 12px">Mettili nell'ordine in cui li trovi nel tuo supermercato. La lista li seguirà.</p>
    ${o.map((r,i)=>`<div class="riga">
      <span class="etichetta">${esc(r)}</span>
      <button class="icona" data-sposta="${esc(r)}|-1" ${i===0?'disabled':''} aria-label="Sposta ${esc(r)} in su">↑</button>
      <button class="icona" data-sposta="${esc(r)}|1" ${i===o.length-1?'disabled':''} aria-label="Sposta ${esc(r)} in giù">↓</button>
    </div>`).join('')}`);
}
function foglioStatistiche(){
  const st=statistiche();
  let c='<h3>Cosa butti e cosa compri</h3>';
  if(!st.sprechi.length&&!st.comprati.length){
    c+='<div class="vuoto-stato">Ancora niente da mostrare.<br>Usa il cestino 🗑 nella dispensa quando butti qualcosa, e i numeri arrivano da soli.</div>';
  }
  if(st.sprechi.length){
    c+='<div class="titoletto"><span>Buttato più spesso</span></div>';
    c+=st.sprechi.map(s=>`<div class="riga">
      <div class="voce"><div class="n">${esc(s.n)}</div><div class="g ${s.c&&s.b/s.c>0.5?'allarme':''}">buttato ${s.b} volte su ${s.c||'?'} comprate</div></div>
    </div>`).join('');
  }
  if(st.comprati.length){
    c+='<div class="titoletto"><span>Comprato più spesso</span></div>';
    c+=st.comprati.map(s=>`<div class="riga"><span class="etichetta">${esc(s.n)}</span><span class="tag mano">${s.c}×</span></div>`).join('');
  }
  apriFoglio(c);
}
function foglioSync(){
  const s=S.sync||{};
  apriFoglio(`<h3>Sincronizza fra telefono e PC</h3>
    <p class="sub" style="margin:-6px 0 12px">Facoltativo. Serve un progetto Supabase con una tabella <code>cucina_stato</code> (colonne: id testo chiave primaria, dati jsonb, aggiornato timestamp).</p>
    <div class="aggiungi"><input id="sUrl" placeholder="https://xxxx.supabase.co" value="${esc(s.url||'')}" autocomplete="off" aria-label="Indirizzo del progetto Supabase"></div>
    <div class="aggiungi"><input id="sKey" placeholder="Chiave anon" value="${esc(s.key||'')}" autocomplete="off" aria-label="Chiave anon"></div>
    <button class="fine-spesa" id="salvaSync" style="margin-bottom:8px">Salva le credenziali</button>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button class="riga" id="pushSync" style="justify-content:center;font-weight:700">Carica ↑</button>
      <button class="riga" id="pullSync" style="justify-content:center;font-weight:700">Scarica ↓</button>
    </div>
    <div id="esitoSync" class="sub"></div>`);
}
function foglioImpostazioni(){
  apriFoglio(`<h3>Opzioni</h3>
    <button class="scelta" id="apriCorsie"><span class="n">Ordine delle corsie</span><span class="d">→</span></button>
    <button class="scelta" id="apriStat"><span class="n">Cosa butti e cosa compri</span><span class="d">→</span></button>
    <button class="scelta" id="apriSync"><span class="n">Sincronizza fra dispositivi</span><span class="d">→</span></button>
    <button class="scelta" id="apriReset"><span class="n" style="color:var(--terra)">Azzera tutto</span><span class="d">→</span></button>`);
}
async function azzera(){
  if(!confirm('Cancella dispensa, lista e settimana. Sicuro?'))return;
  S={dispensa:{},settimana:{},lista:{},extra:[],modoLista:'mancante',pref:{},no:{},mie:[],mieiProd:[],storico:{},ordine:[],avanzi:{},conta:{},buttati:{},faccende:{},mieFaccende:[],sync:{url:'',key:''},ver:4};
  clearTimeout(salvataggio);salvataggio=null;
  await archivio.cancella(CHIAVE);
  aggiornaMappa();aggiornaCene();
  chiudiFoglio();renderTutto();
}
document.getElementById('btnImpostazioni').onclick=foglioImpostazioni;
document.getElementById('btnOpzioniLato').onclick=foglioImpostazioni;
document.getElementById('btnPreferiti').addEventListener('click',()=>{catAperta='pref';ricercaCene='';renderCene();window.scrollTo(0,0);});

/* registrazione offline: fallisce senza rumore se aperta come file locale */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ============ AVVIO ============ */
let giornoMostrato=null;
function scriviData(){
  const d=new Date();
  giornoMostrato=oggiISO();
  document.getElementById('dataOggi').textContent=
    d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
}
/* Un'app installata sul telefono resta aperta per giorni: a mezzanotte
   la data in testata e "la cena di stasera" sarebbero di ieri. */
function controllaGiorno(){
  if(!giornoMostrato||giornoMostrato===oggiISO())return;
  // non strappare il lavoro di mano: se c'è un foglio aperto o stai scrivendo,
  // si riprova al giro dopo (il controllo gira ogni minuto).
  // il velo viene marcato subito da apriFoglio, la classe sul foglio solo
  // al fotogramma dopo: guardare il velo è la verifica affidabile.
  const a=document.activeElement;
  if(document.getElementById('velo').classList.contains('aperto'))return;
  if(document.getElementById('spesaGrande'))return;
  if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA'))return;
  scriviData();renderTutto();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')controllaGiorno();});
window.addEventListener('focus',controllaGiorno);
setInterval(controllaGiorno,60000);

(async()=>{
  try{
    scriviData();
    document.getElementById('vistaStasera').innerHTML='<div class="caricamento">Carico…</div>';
    await carica();
    aggiornaMappa();aggiornaCene();
    renderTutto();
  }catch(e){
    document.getElementById('vistaStasera').innerHTML=
      '<div class="vuoto-stato">Qualcosa si è rotto all\'avvio.<br><span style="font-family:var(--mono);font-size:11px">'+
      String(e&&e.message||e)+'</span></div>';
  }
})();
</script>
